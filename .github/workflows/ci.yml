name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate every example worklog (structural + lifecycle)
        run: |
          set -e
          for f in examples/*.jsonl; do
            echo "== $f =="
            node tools/verify-worklog.mjs --file "$f"
          done

      - name: Strict-validate the clean examples
        run: |
          node tools/verify-worklog.mjs --file examples/relay.jsonl --strict
          node tools/verify-worklog.mjs --file examples/solo.jsonl --strict

      - name: Check examples against the JSON Schema
        run: |
          npm install --no-save ajv@8 ajv-formats@3
          node tools/schema-check.mjs examples/*.jsonl

      - name: Validator self-test
        working-directory: tools
        run: npm test
